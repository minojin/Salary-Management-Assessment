spring:
  application:
    name: salary-management
  datasource:
    url: jdbc:sqlite:${DB_PATH:./salary.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; a small pool avoids lock contention.
      maximum-pool-size: 4
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate validation is too strict for SQLite type affinity
      # (e.g. INTEGER PRIMARY KEY vs BIGINT); repository tests against SQLite cover the mapping.
      ddl-auto: none
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  seed:
    # Seeds employees on startup if the table is empty. Set to 0 to disable.
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
    # Wipe and re-seed (used by scripts/seed.sh).
    reset: ${SEED_RESET:false}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}
